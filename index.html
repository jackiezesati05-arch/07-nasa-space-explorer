<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NASA Space Explorer</title>
  <link href="style.css" rel="stylesheet" type="text/css" />
</head>
<body>
  <div class="container">
    <header class="site-header">
      <img src="img/nasa-worm-logo.png" alt="NASA Logo" class="logo" />
      <h1>Space Explorer</h1>
    </header>

    <div class="filters">
      <label class="date-field" for="startDate">
        <span>Start date</span>
        <input type="date" id="startDate" />
      </label>
      <label class="date-field" for="endDate">
        <span>End date</span>
        <input type="date" id="endDate" />
      </label>
      <button id="getImagesButton" type="button">Get Space Images</button>
    </div>

    <section class="space-fact" aria-labelledby="spaceFactTitle">
      <h2 id="spaceFactTitle">Did You Know?</h2>
      <p id="spaceFact"></p>
    </section>

    <div id="gallery" class="gallery" aria-live="polite">
      <div class="placeholder" role="status">
        <p>🔄 Loading space photos…</p>
      </div>
    </div>
    <div id="pagination" class="pagination" aria-label="Gallery pages" hidden></div>
  </div>

  <dialog id="imageModal" class="image-modal" aria-labelledby="modalTitle" aria-describedby="modalExplanation">
    <div class="modal-header">
      <h2 id="modalTitle"></h2>
      <button id="closeModalButton" class="modal-close" type="button" aria-label="Close image details">Close</button>
    </div>
    <img id="modalImage" class="modal-image" alt="" />
    <p id="modalDate" class="modal-date"></p>
    <p id="modalExplanation" class="modal-explanation"></p>
  </dialog>

  <script src="js/dateRange.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
